name: Etherna Web Build

# Builds the Etherna-branded `web` image and publishes it to Docker Hub.
# Only the `web` image carries Etherna branding; the rest of the stack
# (prosody/jicofo/jvb/jibri/jigasi) reuses the upstream `jitsi/*` images at
# the same stable version (see web/etherna/BASE_TAG).
#
# Required secrets (org-level, available to all Etherna repos):
#   DOCKER_USERNAME - Docker Hub user with push access to the `etherna` namespace
#   DOCKER_PASSWORD - Docker Hub access token / password for that user

on:
  push:
    branches:
      - etherna
    tags:
      - "etherna-*"
    paths:
      - "web/**"
      - ".github/workflows/etherna-web.yml"
  pull_request:
    paths:
      - "web/**"
      - ".github/workflows/etherna-web.yml"
  workflow_dispatch:

env:
  IMAGE_NAME: etherna/jitsi-web

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Compute image tags and base
        id: meta
        run: |
          BASE_TAG=$(tr -d '[:space:]' < web/etherna/BASE_TAG)
          SHORT_SHA=$(git rev-parse --short HEAD)
          IMAGE="${IMAGE_NAME}"
          echo "base_tag=${BASE_TAG}" >> "$GITHUB_OUTPUT"
          {
            echo "tags<<EOF"
            echo "${IMAGE}:latest"
            echo "${IMAGE}:stable"
            echo "${IMAGE}:${BASE_TAG}"
            echo "${IMAGE}:${BASE_TAG}-${SHORT_SHA}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: linux/amd64,linux/arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: ${{ github.event_name != 'pull_request' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push (web)
        uses: docker/build-push-action@v6
        with:
          context: ./web
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            JITSI_REPO=jitsi
            BASE_TAG=${{ steps.meta.outputs.base_tag }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
